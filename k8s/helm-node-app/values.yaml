replicaCount: 1

image:
  repository: mydockerhub/node-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

container:
  port: 3000

env:
  NODE_ENV: production

database:
  host: mysql
  port: 3306
  name: appdb
  user: appuser

envFromSecrets: []

ingress:
  host: node-app.local

resourceQuota:
  requests:
    cpu: "2"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "4Gi"
  pods: "20"
