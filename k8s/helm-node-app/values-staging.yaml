replicaCount: 2
image:
  repository: mzm1/node-swagger-metrics
  tag: 511fc5333589218aae8ad058b9ccb43ad07ef89a
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
container:
  port: 3000
env:
  NODE_ENV: staging
database:
  host: mysql-staging.mysql-dev.svc.cluster.local
  port: 3306
  name: app_db
ingress:
  host: staging.node-app.local
mysql:
  MYSQL_USER: appuser
  MYSQL_PASSWORD: apppassword
auth:
  existingSecret: ""
probes:
  liveness:
    path: /livez
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
resourceQuota:
  requests:
    cpu: "2"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "4Gi"
  pods: "15"
