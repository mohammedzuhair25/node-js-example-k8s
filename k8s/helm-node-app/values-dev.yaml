replicaCount: 1
image:
  repository: mzm1/node-swagger-metrics
  tag: 03a13466a0fabf505c27e1dcd7e89812a9127aa1
service:
  type: NodePort
  port: 3000
  targetPort: 3000
container:
  port: 3000
env:
  NODE_ENV: development
database:
  host: mysql-dev.mysql-dev.svc.cluster.local
  port: 3306
  name: app_db
ingress:
  host: dev.node-app.local
mysql:
  MYSQL_USER: appuser
  MYSQL_PASSWORD: apppassword
auth:
  existingSecret: ""
probes:
  liveness:
    path: /livez
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

resourceQuota:
  requests:
    cpu: "1"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"
  pods: "10"

