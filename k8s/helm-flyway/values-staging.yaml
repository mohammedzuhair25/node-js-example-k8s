namespace: flyway-staging
image:
  repository: mzm1/flyway-migrations
  tag: "1.0.0"
  pullPolicy: IfNotPresent

database:
  host: mysql-staging.mysql-dev.svc.cluster.local
  port: 3306
  name: app_db
  user: appuser

secret:
  name: mysql-secret
  passwordKey: password

job:
  name: flyway-migration-staging
  restartPolicy: Never
  backoffLimit: 3
