replicaCount: 1

auth:
  existingSecret: mysql-staging-auth

persistence:
  accessModes:
    - ReadWriteMany
  size: 10Gi
  storageClassName: nfs-storage

service:
  type: ClusterIP
  port: 3306

mysql:
    database: node-app-db
    user: node-app-user
    password: node-app-password
    rootPassword: node-app-root-password