replicaCount: 1

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

service:
  port: 3306

auth:
  existingSecret: ""

mysql:
  host: mysql
  database: appdb
  user: appuser
  password: apppassword
  rootPassword: rootpassword

persistence:
  enabled: true
  accessModes:
    - ReadWriteMany
  size: 5Gi
  storageClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

resourceQuota:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"
  pods: "20"
