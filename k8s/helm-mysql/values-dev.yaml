replicaCount: 1

auth:
  existingSecret: mysql-dev-auth

persistence:
  accessModes:
    - ReadWriteMany
  size: 5Gi
  storageClassName: nfs-storage

service:
  type: ClusterIP
  port: 3306

mysql:
    database: app_db
    user: appuser
    password: apppassword
    rootPassword: node-app-root-password

resourceQuota:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"
  pods: "10"