replicaCount: 1

auth:
  existingSecret: mysql-dev-auth

persistence:
  accessModes:
    - ReadWriteMany
  size: 5Gi
  storageClassName: nfs-storage

service:
  type: ClusterIP
  port: 3306

mysql:
    host: mysql
    database: app_db
    user: node-app-user
    password: node-app-password
    rootPassword: node-app-root-password