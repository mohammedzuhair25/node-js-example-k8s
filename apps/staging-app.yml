apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-app-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mohammedzuhair25/node-js-example-k8s.git
    targetRevision: main
    path: k8s/helm-node-app
    helm:
      releaseName: node-app-staging
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: node-app-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
