apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flyway-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mohammedzuhair25/node-js-example-k8s.git
    targetRevision: main
    path: k8s/helm-flyway
    helm:
      releaseName: flyway-dev
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: flyway-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
